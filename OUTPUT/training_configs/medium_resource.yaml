# Medium-resource language training configuration
# For languages with 2k-30k examples: af

model:
  model_id: "openai/whisper-large-v3"
  gradient_checkpointing: true
  use_cache: false

training:
  batch_size: 8
  gradient_accumulation_steps: 4  # Effective batch size: 32
  learning_rate: 1e-4
  max_steps: 3000
  warmup_steps: 300
  lr_scheduler: "linear_with_warmup"
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

data:
  max_audio_length: 30.0
  min_audio_length: 0.3
  apply_specaugment: true
  time_mask_param: 10
  freq_mask_param: 10

evaluation:
  eval_strategy: "steps"
  eval_steps: 300
  metric_for_best_model: "wer"
  greater_is_better: false
  load_best_model_at_end: true

checkpointing:
  save_strategy: "steps"
  save_steps: 300
  save_total_limit: 3

early_stopping:
  patience: 3
  threshold: 0.001

